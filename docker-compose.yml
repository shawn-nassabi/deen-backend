services:
  api:
    build: .
    container_name: deen-backend
    env_file:
      - .env
    expose:
      - "8000"
    # Loopback-only publish so the host (deploy workflow health gate, box-local
    # curl) can reach /health directly. NOT internet-exposed — Caddy remains
    # the public entrypoint on :80/:443.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: deen-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
