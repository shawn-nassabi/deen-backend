[pytest]
# Don't collect tests/db by default — those tests require a reachable
# Postgres at the configured DATABASE_URL and will hard-fail collection
# without one. Run them explicitly with `pytest tests/db -q` when a DB is
# available.
norecursedirs = tests/db venv .git .pytest_cache __pycache__

# Custom markers used in this project. `real_llm` opts a test into the
# opt-in suite that hits real Anthropic / Pinecone / Redis — never run
# in default CI, only locally or on a scheduled job.
markers =
    real_llm: opt-in tests that exercise real LLM/Pinecone/Redis (skipped by default)

# Skip opt-in real_llm tests by default. Override with `-m real_llm`.
addopts = -m "not real_llm"
